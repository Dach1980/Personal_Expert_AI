services:
  postgres:
    image: postgres:16
    container_name: personal-expert-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: personal_expert
      POSTGRES_USER: personal_expert
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personal_expert -d personal_expert"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
